<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450"><defs><style>.box{rx:8;stroke-width:2}.input-box{fill:#e3f2fd;stroke:#1976d2}.process-box{fill:#fff9c4;stroke:#f57c00}.output-box{fill:#c8e6c9;stroke:#388e3c}.model-box{fill:#f3e5f5;stroke:#7b1fa2}.text-title{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#333}.text-body,.text-small{font-family:Arial,sans-serif;font-size:14px;fill:#555}.text-small{font-size:12px;fill:#666}.arrow{fill:none;stroke:#666;stroke-width:2.5;marker-end:url(#arrowhead)}.label-bg{fill:#fff;stroke:#999;stroke-width:1;rx:4}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#666" points="0 0 10 3 0 6"/></marker></defs><g id="stage1"><rect width="180" height="100" x="50" y="120" class="box input-box"/><text x="140" y="155" class="text-title" text-anchor="middle">Inputs</text><text x="140" y="185" class="text-small" text-anchor="middle">Current Application + Prompts</text><text x="140" y="205" class="text-small" text-anchor="middle">+ Sample Data</text></g><path d="M 230 170 L 280 170" class="arrow"/><rect width="30" height="25" x="240" y="150" class="label-bg"/><text x="255" y="167" class="text-small" text-anchor="middle">Build</text><g id="stage2"><rect width="180" height="100" x="280" y="120" class="box process-box"/><text x="370" y="155" class="text-title" text-anchor="middle">Training</text><text x="370" y="175" class="text-title" text-anchor="middle">Dataset</text><text x="370" y="200" class="text-small" text-anchor="middle">Inputs + Current Outputs</text></g><path d="M 460 170 L 510 170" class="arrow"/><rect width="30" height="25" x="470" y="150" class="label-bg"/><text x="485" y="167" class="text-small" text-anchor="middle">Run</text><g id="stage3"><rect width="180" height="100" x="510" y="120" class="box process-box"/><text x="600" y="155" class="text-title" text-anchor="middle">Prompt</text><text x="600" y="175" class="text-title" text-anchor="middle">Optimization</text><text x="600" y="200" class="text-small" text-anchor="middle">Optimize prompts</text></g><path d="M 690 170 L 740 170" class="arrow"/><rect width="30" height="25" x="700" y="150" class="label-bg"/><text x="715" y="167" class="text-small" text-anchor="middle">Get</text><g id="stage4"><rect width="180" height="100" x="740" y="120" class="box output-box"/><text x="830" y="155" class="text-title" text-anchor="middle">Optimized</text><text x="830" y="175" class="text-title" text-anchor="middle">Prompts</text><text x="830" y="200" class="text-small" text-anchor="middle">Minimal Drift</text></g><g id="current-model"><rect width="180" height="80" x="50" y="290" class="box model-box"/><circle cx="75" cy="320" r="12" fill="none" stroke="#7B1FA2" stroke-width="2"/><circle cx="75" cy="320" r="8" fill="none" stroke="#7B1FA2" stroke-width="2"/><circle cx="75" cy="320" r="4" fill="#7B1FA2"/><text x="100" y="320" class="text-body" font-weight="bold">Current LLM</text><text x="100" y="340" class="text-small">(e.g., GPT-4o)</text><text x="100" y="360" fill="#999" class="text-small">Original model</text></g><g id="new-model"><rect width="180" height="80" x="280" y="290" class="box model-box"/><circle cx="305" cy="320" r="12" fill="none" stroke="#7B1FA2" stroke-width="2"/><circle cx="305" cy="320" r="8" fill="none" stroke="#7B1FA2" stroke-width="2"/><circle cx="305" cy="320" r="4" fill="#7B1FA2"/><text x="330" y="320" class="text-body" font-weight="bold">Target LLM</text><text x="330" y="340" class="text-small">(e.g., GPT-4o-mini)</text><text x="330" y="360" fill="#999" class="text-small">Destination model</text></g><path stroke="#7B1FA2" stroke-width="3" d="M 140 290 L 140 250 L 370 250 L 370 220" class="arrow"/><rect width="100" height="30" x="210" y="235" fill="#F3E5F5" stroke="#7B1FA2" class="label-bg"/><text x="260" y="255" fill="#7B1FA2" class="text-small" font-weight="bold" text-anchor="middle">Generate labels</text><path stroke="#7B1FA2" stroke-width="3" d="M 370 290 L 370 270 L 600 270 L 600 220" class="arrow"/><rect width="100" height="30" x="435" y="235" fill="#F3E5F5" stroke="#7B1FA2" class="label-bg"/><text x="485" y="255" fill="#7B1FA2" class="text-small" font-weight="bold" text-anchor="middle">Optimize for</text></svg>